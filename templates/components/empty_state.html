<div class="text-center py-20 bg-white rounded-lg shadow-sm border border-dashed border-gray-300">
    <i class="{{ icon | default('fa-solid fa-ghost') }} text-4xl text-gray-300 mb-4"></i>
    <h3 class="text-lg font-medium text-gray-900">{{ title | default('لا توجد نتائج') }}</h3>
    <p class="text-gray-500">{{ message | default('جرب تغيير شروط البحث أو العودة لاحقاً') }}</p>
    {% if action_link %}
    <div class="mt-6">
        <a href="{{ action_link }}" class="inline-block bg-primary-600 text-white px-6 py-2 rounded-lg hover:bg-primary-700 transition font-bold shadow-lg shadow-primary-500/30">
            {{ action_text | default('العودة') }}
        </a>
    </div>
    {% endif %}
</div>
