<!-- Current Images -->
<div class="sm:col-span-6 border-t pt-6">
    <label class="block text-sm font-medium text-gray-700 mb-4">الصور الحالية</label>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        {% for image in listing.images %}
        <div class="relative group">
            <img src="{{ image.image_path }}"
                class="h-24 w-full object-cover rounded-lg border border-gray-200">
            <div
                class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition rounded-lg">
                <button type="submit" name="delete_image" value="{{ image.id }}"
                    class="text-white hover:text-red-500"
                    onclick="return swalConfirm(this, 'حذف الصورة؟', 'هل أنت متأكد من رغبتك في حذف هذه الصورة نهائياً؟', 'warning')">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
        {% endfor %}
        {% if not listing.images %}
        <p class="text-sm text-gray-500 col-span-full">لا توجد صور حالياً.</p>
        {% endif %}
    </div>
</div>
