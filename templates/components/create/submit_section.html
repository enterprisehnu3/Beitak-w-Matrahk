<div class="flex justify-end gap-3">
    <button type="button"
        onclick="if(window.history.length > 1) { window.history.back(); } else { window.location.href='{{ url_for('dashboard.index') }}'; }"
        class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none transition">
        إلغاء
    </button>
    <button type="submit"
        class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition shadow-lg shadow-primary-500/30">
        {{ submit_text | default('نشر الإعلان') }}
    </button>
</div>
