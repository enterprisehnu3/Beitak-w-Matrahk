<div class="bg-white rounded-lg shadow-sm p-6 sticky top-24">
    <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">فلترة البحث</h2>
    <form action="{{ url_for('listings.browse') }}" method="GET">
        <!-- Keyword Search -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">ابحث عن كلمة معينة</label>
            <div class="relative">
                <input type="text" name="q" placeholder="مثلاً: مدينة نصر، مكيف..."
                    value="{{ request.args.get('q', '') }}"
                    class="w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500 text-sm pl-10">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs"></i>
                </div>
            </div>
        </div>

        <!-- City -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">المدينة</label>
            <select name="city"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500 text-sm">
                <option value="">كل المدن</option>
                <option value="Cairo" {% if request.args.get('city') == 'Cairo' %}selected{% endif %}>القاهرة</option>
                <option value="Giza" {% if request.args.get('city') == 'Giza' %}selected{% endif %}>الجيزة</option>
                <option value="Alexandria" {% if request.args.get('city') == 'Alexandria' %}selected{% endif %}>الإسكندرية</option>
                <option value="Mansoura" {% if request.args.get('city') == 'Mansoura' %}selected{% endif %}>المنصورة</option>
            </select>
        </div>

        <!-- Price Range -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">السعر (ج.م)</label>
            <div class="flex items-center gap-2">
                <input type="number" name="price_min" placeholder="من" min="0"
                    oninput="if(this.value < 0) this.value = 0;"
                    value="{{ request.args.get('price_min', '') }}"
                    class="w-full border-gray-300 rounded-md shadow-sm text-sm">
                <span class="text-gray-500">-</span>
                <input type="number" name="price_max" placeholder="إلى" min="0"
                    oninput="if(this.value < 0) this.value = 0;"
                    value="{{ request.args.get('price_max', '') }}"
                    class="w-full border-gray-300 rounded-md shadow-sm text-sm">
            </div>
        </div>

        <!-- Rental Period -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">نظام الإيجار</label>
            <select name="rental_period"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500 text-sm">
                <option value="">الكل</option>
                <option value="monthly" {% if request.args.get('rental_period')=='monthly' %}selected{%
                    endif %}>شهري</option>
                <option value="weekly" {% if request.args.get('rental_period')=='weekly' %}selected{%
                    endif %}>أسبوعي</option>
            </select>
        </div>

        <!-- Type -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">نوع السكن</label>
            <div class="space-y-2">
                <label class="flex items-center">
                    <input type="checkbox" name="type" value="room" {% if 'room' in
                        request.args.getlist('type') %}checked{% endif %}
                        class="rounded border-gray-300 text-primary-600 focus:ring-primary-500">
                    <span class="mr-2 text-sm text-gray-600">غرفة مستقلة</span>
                </label>
                <label class="flex items-center">
                    <input type="checkbox" name="type" value="bed" {% if 'bed' in
                        request.args.getlist('type') %}checked{% endif %}
                        class="rounded border-gray-300 text-primary-600 focus:ring-primary-500">
                    <span class="mr-2 text-sm text-gray-600">سرير في غرفة</span>
                </label>
            </div>
        </div>

        <!-- Gender -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">الجنس</label>
            <select name="gender"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500 text-sm">
                <option value="">الكل</option>
                <option value="male" {% if request.args.get('gender')=='male' %}selected{% endif %}>ذكور
                    فقط</option>
                <option value="female" {% if request.args.get('gender')=='female' %}selected{% endif %}>
                    إناث فقط</option>
            </select>
        </div>

        <!-- Amenities -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">المميزات</label>
            <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                {% set amenity_list = [
                    ('wifi', 'واي فاي'),
                    ('ac', 'تكييف'),
                    ('kitchen', 'مطبخ مجهز'),
                    ('elevator', 'أسانسير'),
                    ('hot_water', 'سخان بمياه')
                ] %}
                {% for val, label in amenity_list %}
                <label class="flex items-center">
                    <input type="checkbox" name="amenities" value="{{ val }}" {% if val in
                        request.args.getlist('amenities') %}checked{% endif %}
                        class="rounded border-gray-300 text-primary-600 focus:ring-primary-500">
                    <span class="mr-2 text-sm text-gray-600">{{ label }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- Sorting Options -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">ترتيب حسب</label>
            <select name="sort_by"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500 text-sm">
                <option value="newest" {% if request.args.get('sort_by')=='newest' %}selected{% endif %}>الأحدث</option>
                <option value="price_asc" {% if request.args.get('sort_by')=='price_asc' %}selected{% endif %}>السعر (الأقل للأكثر)</option>
                <option value="price_desc" {% if request.args.get('sort_by')=='price_desc' %}selected{% endif %}>السعر (الأكثر للأقل)</option>
            </select>
        </div>

        <button type="submit"
            class="w-full bg-primary-600 text-white py-2 rounded-md hover:bg-primary-700 transition shadow-lg shadow-primary-500/30">
            تطبيق الفلتر
        </button>
    </form>
</div>
