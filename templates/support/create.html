{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
        <div class="bg-primary-600 p-8 text-white">
            <h1 class="text-2xl font-bold mb-2">الدعم الفني والشكاوى</h1>
            <p class="text-primary-100 text-sm">يسعدنا مساعدتك في حل أي مشكلة تواجهك داخل المنصة.</p>
        </div>
        
        <div class="p-8">
            <form action="{{ url_for('support.submit_ticket') }}" method="POST" class="space-y-6">
                <div>
                    <label for="subject" class="block text-sm font-bold text-gray-700 mb-2">موضوع البلاغ</label>
                    <select name="subject" id="subject" required
                        class="w-full bg-gray-50 border-gray-200 rounded-xl focus:ring-primary-500 focus:border-primary-500 py-3 px-4 border">
                        <option value="scam_report">إبلاغ عن إعلان وهمي أو احتيال</option>
                        <option value="payment_issue">مشكلة في الدفع</option>
                        <option value="account_issue">مشكلة في الحساب</option>
                        <option value="homeowner_complaint">شكوى ضد مؤجر</option>
                        <option value="tenant_complaint">شكوى ضد مستأجر</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                
                <div>
                    <label for="message" class="block text-sm font-bold text-gray-700 mb-2">تفاصيل المشكلة</label>
                    <textarea name="message" id="message" rows="6" required
                        placeholder="يرجى كتابة تفاصيل المشكلة بوضوح مع ذكر أرقام الحجز إن وجدت..."
                        class="w-full bg-gray-50 border-gray-200 rounded-xl focus:ring-primary-500 focus:border-primary-500 py-3 px-4 border"></textarea>
                </div>
                
                <div class="flex items-start gap-3 bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                    <i class="fa-solid fa-circle-exclamation text-yellow-600 mt-1"></i>
                    <p class="text-xs text-yellow-700 leading-relaxed">
                        سيتم مراجعة طلبك من قبل فريق الإشراف والرد عليك خلال 24 ساعة كحد أقصى. يمكنك متابعة حالة الطلب من لوحة التحكم الخاصة بك.
                    </p>
                </div>
                
                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-primary-600 text-white font-bold py-3 rounded-xl hover:bg-primary-700 transition-all shadow-lg shadow-primary-500/30 transform hover:-translate-y-0.5">
                        إرسال الطلب
                    </button>
                    <a href="{{ url_for('dashboard.index') }}" class="block text-center mt-4 text-sm text-gray-500 hover:text-gray-700">إلغاء والعودة</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
