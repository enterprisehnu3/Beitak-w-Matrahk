{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100 relative overflow-hidden">
        
        <!-- Progress Bar (Visual) -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gray-100">
            <div class="h-full bg-primary-600 w-1/2"></div>
        </div>

        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-50 text-primary-600 mb-4">
                <i class="fa-solid fa-face-smile text-3xl"></i>
            </div>
            <h2 class="text-3xl font-black text-gray-900 tracking-tight">
                توثيق الهوية
            </h2>
            <p class="mt-3 text-sm text-gray-500 leading-relaxed">
                الخطوة الأخيرة قبل اختيار دورك. يرجى التقاط صورة سيلفي واضحة وأنت تحمل بطاقة الرقم القومي بجوار وجهك.
            </p>
        </div>

        <form class="mt-8 space-y-6" action="{{ url_for('auth.selfie_verification') }}" method="POST">
            
            <!-- Live Selfie Capture -->
            <div class="bg-gray-50 p-1 rounded-2xl">
                <button type="button" id="btn-start-camera" class="w-full py-8 border-2 border-dashed border-primary-300 bg-white rounded-xl text-primary-700 hover:bg-primary-50 transition flex flex-col items-center justify-center gap-3 shadow-sm group">
                    <div class="w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-camera text-2xl text-primary-600"></i>
                    </div>
                    <span class="font-bold">افتح الكاميرا لالتقاط الصورة</span>
                </button>

                <div class="relative bg-black rounded-xl overflow-hidden shadow-inner hidden" id="camera-container">
                    <video id="video-feed" autoplay playsinline class="w-full h-auto max-h-[400px] object-cover transform scale-x-[-1]"></video>
                    <canvas id="photo-canvas" class="hidden"></canvas>
                    <img id="photo-preview" class="hidden w-full h-auto max-h-[400px] object-cover" />
                    
                    <!-- Camera Controls Overlay -->
                    <div class="absolute bottom-6 left-0 right-0 flex justify-center gap-4 px-4 z-10">
                        <button type="button" id="btn-capture" class="bg-white text-gray-900 w-16 h-16 rounded-full shadow-2xl hover:scale-105 transition border-4 border-gray-200 flex items-center justify-center focus:outline-none">
                            <div class="w-12 h-12 bg-white rounded-full border-2 border-gray-300"></div>
                        </button>
                        <button type="button" id="btn-retake" class="hidden bg-gray-900/80 backdrop-blur-md text-white px-6 py-2.5 rounded-full shadow-lg hover:bg-black transition flex items-center gap-2 focus:outline-none font-bold text-sm border border-gray-700">
                            <i class="fa-solid fa-rotate-right"></i> إعادة التقاط
                        </button>
                    </div>
                </div>
                
                <!-- Hidden input to store Base64 image -->
                <input type="hidden" name="id_selfie" id="id_selfie" required>
            </div>

            <div class="pt-2">
                <button type="submit" id="btn-submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 shadow-lg shadow-primary-500/30 transition transform hover:-translate-y-0.5">
                    توثيق والمتابعة <i class="fa-solid fa-check ml-2 mt-0.5"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const btnStartCamera = document.getElementById('btn-start-camera');
    const cameraContainer = document.getElementById('camera-container');
    const videoFeed = document.getElementById('video-feed');
    const photoCanvas = document.getElementById('photo-canvas');
    const photoPreview = document.getElementById('photo-preview');
    const btnCapture = document.getElementById('btn-capture');
    const btnRetake = document.getElementById('btn-retake');
    const hiddenSelfieInput = document.getElementById('id_selfie');
    const form = document.querySelector('form');
    let stream = null;

    if (btnStartCamera) {
        btnStartCamera.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                videoFeed.srcObject = stream;
                btnStartCamera.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
            } catch (err) {
                console.error("Error accessing camera: ", err);
                Swal.fire('خطأ', 'لم نتمكن من الوصول إلى الكاميرا. يرجى التأكد من إعطاء الصلاحيات اللازمة للمتصفح.', 'error');
            }
        });

        btnCapture.addEventListener('click', () => {
            const context = photoCanvas.getContext('2d');
            photoCanvas.width = videoFeed.videoWidth;
            photoCanvas.height = videoFeed.videoHeight;
            
            // Draw unmirrored frame to ensure text on ID is readable
            context.drawImage(videoFeed, 0, 0, photoCanvas.width, photoCanvas.height);
            
            const imageData = photoCanvas.toDataURL('image/jpeg', 0.85);
            
            photoPreview.src = imageData;
            photoPreview.classList.remove('hidden');
            videoFeed.classList.add('hidden');
            
            btnCapture.classList.add('hidden');
            btnRetake.classList.remove('hidden');
            
            hiddenSelfieInput.value = imageData;
        });

        btnRetake.addEventListener('click', () => {
            photoPreview.classList.add('hidden');
            videoFeed.classList.remove('hidden');
            btnCapture.classList.remove('hidden');
            btnRetake.classList.add('hidden');
            hiddenSelfieInput.value = '';
        });
    }

    form.addEventListener('submit', function(e) {
        if (!hiddenSelfieInput.value) {
            e.preventDefault();
            Swal.fire('تنبيه', 'يجب التقاط صورة السيلفي للمتابعة.', 'warning');
        }
    });
});
</script>
{% endblock %}
