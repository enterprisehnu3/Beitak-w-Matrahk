{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
        <div>
            <div class="mx-auto h-12 w-12 text-primary-600 flex justify-center items-center text-3xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                استعادة كلمة المرور
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                سندقق هويتك عبر رقم البطاقة لإعادة تعيين الباسوورد
            </p>
        </div>
        <form class="mt-8 space-y-4" action="{{ url_for('auth.forgot_password') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                    <input name="email" type="email" required
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                        placeholder="example@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">رقم البطاقة (14 رقم)</label>
                    <input name="national_id" type="text" pattern="\d{14}" required
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                        placeholder="2990101XXXXXXXX">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور الجديدة</label>
                    <div class="relative">
                        <input id="new-password" name="new_password" type="password" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                            placeholder="••••••••">
                        <button type="button" onclick="toggleNewPassword()" class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 hover:text-primary-600 transition">
                            <i id="eye-icon" class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 shadow-lg shadow-primary-500/30 transition">
                    تحديث كلمة المرور
                </button>
            </div>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-sm text-gray-500 hover:text-primary-600 transition">
                    <i class="fa-solid fa-arrow-right ml-1"></i> العودة لتسجيل الدخول
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleNewPassword() {
        const passwordInput = document.getElementById('new-password');
        const eyeIcon = document.getElementById('eye-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        }
    }
</script>
{% endblock %}
