<div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
    <div class="sm:col-span-3">
        <label for="type" class="block text-sm font-medium text-gray-700">نوع السكن</label>
        <select id="type" name="type"
            class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            <option value="room" {% if listing and listing.type == 'room' %}selected{% endif %}>غرفة مستقلة</option>
            <option value="bed" {% if listing and listing.type == 'bed' %}selected{% endif %}>سرير في غرفة مشتركة</option>
        </select>
    </div>
    <div class="sm:col-span-3">
        <label for="gender_req" class="block text-sm font-medium text-gray-700">الجنس</label>
        <select id="gender_req" name="gender_req"
            class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            <option value="any" {% if listing and listing.gender_req == 'any' %}selected{% endif %}>الكل</option>
            <option value="male" {% if listing and listing.gender_req == 'male' %}selected{% endif %}>ذكور فقط</option>
            <option value="female" {% if listing and listing.gender_req == 'female' %}selected{% endif %}>إناث فقط</option>
        </select>
    </div>

    <div class="sm:col-span-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">المميزات المتاحة</label>
        <div
            class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-gray-50 p-4 rounded-lg border border-gray-100">
            {% set amens = listing.amenities.split(',') if listing and listing.amenities else [] %}
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="amenities" value="wifi" {% if 'wifi' in amens %}checked{% endif %}
                    class="rounded border-gray-300 text-primary-600 ml-2"> واي فاي
            </label>
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="amenities" value="ac" {% if 'ac' in amens %}checked{% endif %}
                    class="rounded border-gray-300 text-primary-600 ml-2"> تكييف
            </label>
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="amenities" value="kitchen" {% if 'kitchen' in amens %}checked{% endif %}
                    class="rounded border-gray-300 text-primary-600 ml-2"> مطبخ مجهز
            </label>
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="amenities" value="elevator" {% if 'elevator' in amens %}checked{% endif %}
                    class="rounded border-gray-300 text-primary-600 ml-2"> أسانسير
            </label>
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="amenities" value="hot_water" {% if 'hot_water' in amens %}checked{% endif %}
                    class="rounded border-gray-300 text-primary-600 ml-2"> سخان مياه
            </label>
            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="amenities" value="parking" {% if 'parking' in amens %}checked{% endif %}
                    class="rounded border-gray-300 text-primary-600 ml-2"> جراج
            </label>
        </div>
    </div>

    <div class="sm:col-span-6">
        <label for="description" class="block text-sm font-medium text-gray-700">وصف تفصيلي</label>
        <div class="mt-1">
            <textarea id="description" name="description" rows="3"
                class="shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border border-gray-300 rounded-md p-3"
                placeholder="وصف للغرفة، الأثاث المتاح، المميزات...">{{ listing.description if listing else '' }}</textarea>
        </div>
    </div>
</div>
