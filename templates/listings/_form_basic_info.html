<div class="mt-6 grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
    <div class="sm:col-span-4">
        <label for="title" class="block text-sm font-medium text-gray-700">عنوان الإعلان</label>
        <div class="mt-1">
            <input type="text" name="title" id="title" value="{{ listing.title if listing else '' }}" required
                class="shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md border py-2 px-3 pl-10"
                placeholder="مثال: غرفة واسعة بجوار جامعة القاهرة">
        </div>
    </div>

    <div class="sm:col-span-2">
        <label for="price" class="block text-sm font-medium text-gray-700">السعر</label>
        <div class="mt-1 relative rounded-md shadow-sm">
            <input type="number" name="price" id="price" value="{{ listing.price if listing else '' }}" required min="0"
                oninput="if(this.value < 0) this.value = 0;"
                class="focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md border py-2 px-3 pl-16"
                placeholder="0.00">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="text-gray-500 sm:text-xs">ج.م</span>
            </div>
        </div>
    </div>

    <div class="sm:col-span-2">
        <label for="rental_period" class="block text-sm font-medium text-gray-700">نظام الدفع</label>
        <select id="rental_period" name="rental_period"
            class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            <option value="monthly" {% if listing and listing.rental_period == 'monthly' %}selected{% endif %}>شهري</option>
            <option value="weekly" {% if listing and listing.rental_period == 'weekly' %}selected{% endif %}>أسبوعي</option>
        </select>
    </div>

    <div class="sm:col-span-3">
        <label for="city" class="block text-sm font-medium text-gray-700">المدينة</label>
        <select id="city" name="city" required
            class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
            <option value="Cairo" {% if listing and listing.city == 'Cairo' %}selected{% endif %}>القاهرة</option>
            <option value="Giza" {% if listing and listing.city == 'Giza' %}selected{% endif %}>الجيزة</option>
            <option value="Alexandria" {% if listing and listing.city == 'Alexandria' %}selected{% endif %}>الإسكندرية</option>
            <option value="Mansoura" {% if listing and listing.city == 'Mansoura' %}selected{% endif %}>المنصورة</option>
        </select>
    </div>

    <div class="sm:col-span-3">
        <label for="area" class="block text-sm font-medium text-gray-700">المنطقة / الحي</label>
        <input type="text" name="area" id="area" value="{{ listing.area if listing else '' }}" required
            pattern="^[a-zA-Z\u0600-\u06FF0-9\s]+$" title="يرجى إدخال حروف أو أرقام"
            oninput="this.value = this.value.replace(/[^a-zA-Z\u0600-\u06FF0-9\s]/g, '')"
            class="shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md border py-2 px-3"
            placeholder="مثال: مدينة نصر، المعادي">
    </div>

    <div class="sm:col-span-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">موقع السكن (إحداثيات أو رابط خرائط جوجل)</label>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-[10px] text-gray-400">رابط خرائط Google (قم بلصقه هنا للاستخراج التلقائي)</label>
                <input type="text" id="gmaps-link" class="shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md border py-2 px-3" placeholder="https://maps.google.com/...">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400">خط العرض (Latitude)</label>
                    <input type="text" name="latitude" id="lat-input" value="{{ listing.latitude if listing and listing.latitude else '' }}" class="shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md border py-2 px-3">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400">خط الطول (Longitude)</label>
                    <input type="text" name="longitude" id="lng-input" value="{{ listing.longitude if listing and listing.longitude else '' }}" class="shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md border py-2 px-3">
                </div>
            </div>
        </div>
        <div id="map-picker" class="h-48 w-full rounded-xl border border-gray-200 z-0 opacity-80"></div>
        <p class="text-[10px] text-gray-400 mt-2">يمكنك كتابة الإحداثيات يدوياً، أو لصق رابط جوجل مابس، أو الضغط على الخريطة.</p>
    </div>
</div>
